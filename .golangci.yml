# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional useful linters
    - bodyclose      # Check HTTP response body close
    - exportloopref  # Check for pointers to loop variables
    - gofmt          # Check gofmt formatting
    - goimports      # Check import ordering
    - goconst        # Find repeated strings that could be constants
    - gocritic       # Various checks
    - gosec          # Security scanner
    - misspell       # Spell checker for comments
    - nilerr         # Find nil error returns
    - prealloc       # Suggest slice preallocations
    - unconvert      # Remove unnecessary type conversions
    - unparam        # Find unused function parameters
    - whitespace     # Check for trailing whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/lukivan8/look-at-finance-api

  goconst:
    min-len: 3
    min-occurrences: 3

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance

  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104  # Unhandled errors (covered by errcheck)

  misspell:
    locale: US

issues:
  exclude-rules:
    # Ignore test files for some linters
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - goconst

    # Ignore generated files
    - path: ".*_gen\\.go"
      linters:
        - all

  max-issues-per-linter: 50
  max-same-issues: 3
